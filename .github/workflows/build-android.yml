name: Build Android AAB

# Triggers: every push to main + manual dispatch
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:
    inputs:
      track:
        description: 'Play Store track to upload (none = build only)'
        required: false
        default: 'none'
        type: choice
        options:
          - none
          - internal
          - alpha
          - beta
          - production

permissions:
  # Required so the SHA-256 auto-patch step can commit the updated
  # assetlinks.json back to the repo (Android App Links setup).
  contents: write

jobs:
  build:
    name: Build signed AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. CHECKOUT ────────────────────────────────────────────────────────
      - name: Checkout source
        uses: actions/checkout@v4

      # ── 2. NODE + YARN ─────────────────────────────────────────────────────
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ── 3. JAVA 21 ─────────────────────────────────────────────────────────
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # ── 4. ANDROID SDK ─────────────────────────────────────────────────────
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 platforms;android-36 build-tools;35.0.0 build-tools;36.0.0'

      # ── 5. REACT BUILD ─────────────────────────────────────────────────────
      - name: Install dependencies
        working-directory: frontend
        run: yarn install --network-timeout 600000

      - name: Build React production bundle (USER-only — Admin pages excluded)
        working-directory: frontend
        env:
          REACT_APP_BACKEND_URL: ${{ secrets.REACT_APP_BACKEND_URL }}
          REACT_APP_ADSENSE_INTERSTITIAL_SLOT: ${{ secrets.REACT_APP_ADSENSE_INTERSTITIAL_SLOT }}
          REACT_APP_BUILD_TYPE: user
          CI: false
        run: yarn build:user

      - name: Verify React build output exists
        working-directory: frontend
        run: |
          if [ ! -f build/index.html ]; then
            echo "::error::React build/index.html missing — yarn build:user failed silently."
            ls -la build/ 2>/dev/null || echo "build/ directory missing entirely"
            exit 1
          fi
          echo "✓ React build artifacts present: $(du -sh build | cut -f1)"

      # ── 6. CAPACITOR SYNC ──────────────────────────────────────────────────
      - name: Sync Capacitor with Android
        working-directory: frontend
        run: npx cap sync android

      # ── 7. DECODE KEYSTORE ─────────────────────────────────────────────────
      - name: Restore keystore from secret
        working-directory: frontend
        run: |
          mkdir -p android/keystores
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/keystores/paras-reward.keystore
          ls -la android/keystores/

      # ── 7b. AUTO-PATCH ASSETLINKS.JSON WITH SHA-256 ────────────────────────
      # Extracts the SHA-256 cert fingerprint from the upload keystore and
      # writes it into frontend/public/.well-known/assetlinks.json so Android
      # App Links autoVerify works for parasreward.com / bugzappers.emergent.host.
      # The Play App Signing SHA-256 (different fingerprint, only visible in
      # Play Console after first AAB upload) is injected from the optional
      # PLAY_APP_SIGNING_SHA256 secret if you've set it.
      # If both fingerprints end up identical (e.g., Google opted to reuse
      # your upload key as the App Signing key) the duplicate is collapsed.
      # Idempotent — commits back to main ONLY if assetlinks.json actually
      # changed; otherwise no-op.
      - name: Auto-patch assetlinks.json with upload key SHA-256
        id: patch_assetlinks
        working-directory: frontend
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          PLAY_APP_SIGNING_SHA256: ${{ secrets.PLAY_APP_SIGNING_SHA256 }}
          ASSETLINKS_PATH: public/.well-known/assetlinks.json
        run: |
          set -e
          # 1) Extract upload key SHA-256 (colon-separated UPPERCASE hex)
          UPLOAD_SHA=$(keytool -list -v \
            -keystore android/keystores/paras-reward.keystore \
            -alias "$KEY_ALIAS" \
            -storepass "$KEYSTORE_PASSWORD" \
            2>/dev/null | awk '/SHA256:/ {print $2; exit}')
          if [ -z "$UPLOAD_SHA" ]; then
            echo "::error::Could not extract SHA-256 from keystore. Check KEY_ALIAS / KEYSTORE_PASSWORD secrets."
            exit 1
          fi
          echo "✓ Upload key SHA-256: $UPLOAD_SHA"

          PLAY_SHA="${PLAY_APP_SIGNING_SHA256:-}"
          if [ -n "$PLAY_SHA" ]; then
            echo "✓ Play App Signing SHA-256 (from secret): $PLAY_SHA"
          else
            echo "ℹ Play App Signing SHA-256 secret not set — assetlinks.json will only contain the upload key fingerprint."
            echo "  (Add PLAY_APP_SIGNING_SHA256 secret in GitHub after first AAB upload — value comes from Play Console → Setup → App integrity)"
          fi

          # 2) Export for the python step
          export UPLOAD_SHA
          export PLAY_SHA

          # 3) Rewrite assetlinks.json (use python — handles JSON cleanly).
          # Single-quoted heredoc tag disables shell expansion inside.
          python3 << 'PYEOF'
          import json, os
          path = os.environ['ASSETLINKS_PATH']
          upload_sha = os.environ['UPLOAD_SHA']
          play_sha = os.environ.get('PLAY_SHA') or ''
          with open(path) as f:
              data = json.load(f)
          fps = [upload_sha]
          if play_sha and play_sha != upload_sha:
              fps.append(play_sha)
          data[0]['target']['sha256_cert_fingerprints'] = fps
          with open(path, 'w') as f:
              json.dump(data, f, indent=2)
              f.write('\n')
          PYEOF
          echo "=== Updated assetlinks.json ==="
          cat "$ASSETLINKS_PATH"

          # 4) Export change indicator for the commit step.
          if git diff --quiet --exit-code -- "$ASSETLINKS_PATH"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "ℹ assetlinks.json unchanged — no commit needed."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated assetlinks.json
        if: steps.patch_assetlinks.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/.well-known/assetlinks.json
          git commit -m "chore(android): auto-update assetlinks.json with signing SHA-256 [skip ci]"
          git push origin HEAD:main

      # ── 8. BUILD SIGNED AAB ────────────────────────────────────────────────
      - name: Ensure Gradle wrapper is usable
        working-directory: frontend/android
        run: |
          # The wrapper.jar IS committed to the repo. If for some reason it
          # went missing (broken checkout / clean step / stray .gitignore),
          # regenerate it — but DO NOT call the `wrapper` task, which
          # internally does an HTTP HEAD "validate distribution URL" step
          # that has failed intermittently on GitHub runners (Feb 22 2026
          # AAB build broke exactly at this line: "Test of distribution
          # url https://services.gradle.org/distributions/gradle-8.10.2-all.zip failed").
          # Instead we copy the wrapper.jar shipped inside the downloaded
          # Gradle distribution — that binary is identical to what the
          # `wrapper` task would emit, and copying it bypasses the flaky
          # network validation entirely.
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "gradle-wrapper.jar missing — restoring from official Gradle bin distribution"
            GRADLE_VERSION=8.10.2
            for attempt in 1 2 3; do
              if curl --fail --silent --show-error --location \
                  --retry 3 --retry-delay 5 --max-time 300 \
                  --output /tmp/gradle.zip \
                  "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"; then
                echo "✓ Downloaded gradle-${GRADLE_VERSION}-bin.zip (attempt $attempt)"
                break
              fi
              echo "✗ Download attempt $attempt failed — retrying in 10s"
              sleep 10
            done
            unzip -q /tmp/gradle.zip -d /tmp/
            mkdir -p gradle/wrapper
            cp "/tmp/gradle-${GRADLE_VERSION}/lib/plugins/gradle-wrapper-main-${GRADLE_VERSION}.jar" \
               gradle/wrapper/gradle-wrapper.jar 2>/dev/null || \
            cp "/tmp/gradle-${GRADLE_VERSION}/bin/../lib/gradle-wrapper-${GRADLE_VERSION}.jar" \
               gradle/wrapper/gradle-wrapper.jar 2>/dev/null || {
                 echo "::warning::Could not find gradle-wrapper JAR inside distribution — falling back to gradle wrapper task with --no-configuration-cache"
                 /tmp/gradle-${GRADLE_VERSION}/bin/gradle wrapper \
                   --gradle-version ${GRADLE_VERSION} \
                   --distribution-type bin \
                   --no-configuration-cache
               }
          fi
          ls -la gradle/wrapper/

      - name: Build signed AAB
        working-directory: frontend/android
        env:
          PARAS_KEYSTORE_FILE: ${{ github.workspace }}/frontend/android/keystores/paras-reward.keystore
          PARAS_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          PARAS_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          PARAS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          # Verbose output (--stacktrace --info) so any failure surfaces the
          # actual Gradle/Capacitor error message in the workflow logs.
          ./gradlew bundleRelease --no-daemon --stacktrace --info 2>&1 | tee gradle-build.log
          # Fail loudly if AAB wasn't produced
          if [ ! -f app/build/outputs/bundle/release/app-release.aab ]; then
            echo "::error::AAB file was not produced. See gradle-build.log artifact for details."
            exit 1
          fi

      # If the build fails, upload the verbose gradle log so we can debug.
      - name: Upload gradle build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: frontend/android/gradle-build.log
          retention-days: 7

      # ── 9. UPLOAD AAB ARTIFACT ─────────────────────────────────────────────
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: paras-reward-release-aab
          path: frontend/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14

      # ── 10. UPLOAD TO PLAY STORE (optional, runs only on manual dispatch) ──
      - name: Upload to Play Console
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.track != 'none' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.parasreward.prc
          releaseFiles: frontend/android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.track }}
          status: completed
          changesNotSentForReview: false

      # ── 11. SUMMARY ────────────────────────────────────────────────────────
      - name: Build summary
        if: always()
        run: |
          echo "## 🎉 Build Result" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f frontend/android/app/build/outputs/bundle/release/app-release.aab ]; then
            size=$(du -h frontend/android/app/build/outputs/bundle/release/app-release.aab | cut -f1)
            echo "✅ **AAB built successfully** — size: $size" >> $GITHUB_STEP_SUMMARY
            echo "📦 Download from **Artifacts** section above" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ AAB build failed — check logs" >> $GITHUB_STEP_SUMMARY
          fi

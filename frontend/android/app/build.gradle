apply plugin: 'com.android.application'

android {
    namespace "com.parasreward.prc"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.parasreward.prc"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // versionCode 13 → 14 — Feb 28, 2026 release (2nd batch):
        // 1. Native App Open Ad Capacitor plugin (AppOpenAdPlugin.java)
        //    Auto-shows on every foreground/resume + cold-start branded splash
        // 2. Native Install Referrer Capacitor plugin (InstallReferrerPlugin.java)
        //    Captures Play Store referrer for native-side referral attribution
        // 3. Android App Links — autoVerify intent filter for parasreward.com
        //    + bugzappers.emergent.host (assetlinks.json served from /public/)
        // 4. Mall pricing: MRP + 18% GST + 10% Processing fee (cascading)
        // 5. Referral attribution bug fix (case-insensitive backend lookup,
        //    localStorage persistence)
        //
        // versionCode 14 → 15 — Jun 30, 2026 release:
        // 1. AndroidManifest.xml — fixed invalid `--` inside XML comment that
        //    was breaking processReleaseMainManifest in GitHub Actions.
        // 2. Confirm Booking sheet visibility fix (white-on-white pricing rows).
        // 3. Admin Mall: "Mining Complete" bookings now load via per-status
        //    fetch (fulfilled+delivered+recent-mining) so older fulfilled
        //    rows are never buried by mining churn.
        // 4. Community Forum: new "🚚 Product Delivery" head — admin
        //    "Mark Delivered" auto-publishes celebratory post (real name +
        //    product image) for social proof.
        // 5. Production performance pass: 60s cache layer on
        //    performance-summary / redeem-limit / mining-status / kyc-stats /
        //    gst-summary / public-contact-info; admin redeem-limits-overview
        //    moved to lazy-load. Dashboard time-to-data 10s → 1-2s.
        //
        // versionCode 15 → 16 — Jul 03, 2026 release (Razorpay UPI + PIN reset):
        // Note: Live user testing revealed the AndroidManifest <queries>
        // block alone did NOT restore UPI Apps in the Android checkout.
        // Root cause was Razorpay Checkout.js explicitly requires the
        // `webview_intent: true` flag when running inside a WebView — a
        // documented Razorpay behaviour (see the /webview/upi-intent-android
        // page in their docs). We now pass this flag from JS (detected via
        // Capacitor.isNativePlatform()) and keep the <queries> + intent://
        // parser fixes below as the OS-side counterpart.
        //
        // 1. Razorpay checkout options (SubscriptionPlans.js): added
        //    `webview_intent: true` when running inside Capacitor so the
        //    Checkout modal renders the UPI Apps section (PhonePe / GPay /
        //    Paytm / BHIM / Amazon Pay / WhatsApp Pay etc.).
        // 2. AndroidManifest.xml: <queries> block declaring the upi:// intent
        //    + explicit UPI PSP package names so PackageManager can enumerate
        //    installed UPI apps on Android 11+ (API 30+).
        // 3. MainActivity.java: WebViewClient override that correctly parses
        //    intent:// scheme URIs via Intent.parseUri(URI_INTENT_SCHEME) —
        //    Capacitor's default plain-URI handler cannot route to the
        //    intent's target package.
        // 4. Admin User 360 PIN Reset modal persistence fix (state race that
        //    made the newly generated PIN vanish before admin could copy).
        //
        // versionCode 16 → 18 — Feb 06, 2026 release (Security + Mall + Audit):
        // 1. CRITICAL Razorpay webhook signature strict enforcement — fixes a
        //    revenue-leak where attackers could forge webhook events (missing
        //    signature or missing server-side secret → payloads accepted).
        //    Now BOTH secret + signature are mandatory; 401 on either missing.
        // 2. auto_sync_captured_from_razorpay cron: skip cancelled/failed/
        //    error/timeout/dismissed orders (previously activated regardless).
        // 3. auto_sync_razorpay_payments: fixed duplicate `status` dict key
        //    silently dropping the $in filter clause.
        // 4. Paras Mall Product Mining: 24h LAPSE/BURN logic — if user
        //    doesn't collect within 24h, all accumulated PRC burns.
        // 5. Paras Mall Prepaid Deposit selector — user picks 10/20/35/50%
        //    upfront at booking time; higher deposit → smaller mining target
        //    → faster fulfillment.
        // 6. Paras Mall network cap flat 800 (removed referral scaling for
        //    Mall — main mining unchanged).
        // 7. Product delete → SOFT delete (active bookings continue mining,
        //    hidden from listing only).
        // 8. Admin Bank Redeem Limits config UI — per-tx min/max + monthly
        //    user cap adjustable from AdminSystemSettings without deploy.
        // 9. Admin audit endpoints: /audit-single-user, /audit-paid-plans-
        //    without-payment, /monitor-recent-activations — comprehensive
        //    detection for subscription-without-payment leaks.
        // 10. PRC Statement dedup — removed legacy duplicate "Referral Reward"
        //     entries that appeared as both "Referral Reward" + "Daily Reward".
        // 11. Downline Live Feed data-fetch URL fix (double /api prefix).
        //
        // versionCode 18 → 19 — Feb 12, 2026 release:
        // 12. IST timezone fix for Live Feed earnings buckets (was using UTC).
        // 13. IDOR guards on /live-feed, /earnings-summary, /level-breakdown,
        //     /subtree — cross-user access now 403.
        // 14. "Total Earned" truncation bug fix — was capped at 100 events;
        //     now uses full $group aggregation across window.
        // 15. Admin Mall — pagination (products 12/page, bookings 25/page)
        //     + dedicated Delivery Address column with copy-to-clipboard
        //     + auto-disabled "Mark Delivered" for legacy no-address bookings.
        // 16. Popup Message — sticky header/footer + max-h-90vh scroll body
        //     + ESC + backdrop-click dismiss (fixes trapped-user mobile bug
        //     on long-text popups).
        // 17. Rich-Text Popup Messages v2 — WYSIWYG editor (TipTap),
        //     image upload, YouTube embed, multi-CTA, live preview.
        //     bleach HTML sanitizer on backend blocks XSS.
        // 18. PRODUCTION HOTFIX — popup images migrated from ephemeral
        //     disk to MongoDB (Emergent containers wipe disk on redeploy).
        // 19. Community Growth Dashboard — full /referrals redesign:
        //     17-section gamified page (Overview, Invite Friends w/ QR,
        //     Community Growth Bonus, Goal, Milestone, Health, Power,
        //     Analytics, Redeem Unlock, Mission, Badges, Leaderboard,
        //     Timeline, Monthly Challenge, Share Banner). Terminology
        //     overhaul — no "Commission" in UI.
        // 20. Community Members section — search + sort + tri-state
        //     activity (Active Today / Recently Active / Needs Activity)
        //     + WhatsApp/Call quick actions + empty-state + motivation.
        // 21. Interactive Community Tree — tap-to-drill-down (L1→L2→L3)
        //     with lazy loading + partner badges + WhatsApp nudge button
        //     with pre-filled English reactivation message.
        // 22. BottomNav rename "Invite" → "Community".
        //
        // versionCode 19 → 20 — Feb 17, 2026 release (v1.2.0):
        // 23. NEW 10-Level Community Bonus (max 7.20%) — decreasing table
        //     (L1-L3 = 1.0%, L4-L10 stepping down 0.10% each). Level unlocks
        //     tied to L1 Active Elite direct downline count (10/20/…/70).
        // 24. Community Leader Bonus Multiplier — District 1.25x, Regional
        //     1.50x, State 1.75x, National 2.00x. Applied on top of the
        //     10-level base %. Admin-configurable via /admin/community-leader
        //     endpoints with sanity clamps [0.5, 10.0].
        // 25. PRC Statement — new Daily Summary view (default) with tap-to-
        //     expand day cards. Groups thousands of level-commission rows
        //     into per-day buckets. Detailed pagination still available.
        // 26. Referrals page — removed duplicate "Community Growth Bonus 3%"
        //     card and legacy "Community Levels" L1/L2/L3 tiles; both replaced
        //     by the new 10-level Level Progression card.
        // 27. Retired Core Team feature — Pool Wallet, distribution scheduler,
        //     admin page, dashboard card, badges, ledger type all removed.
        // 28. P0 bugfix — Admin auto-logout on wrong X-Admin-Pin (global
        //     axios interceptor 403 keyword regex tightened).
        //
        // versionCode 21 → 22 — Feb 17, 2026 hotfix over v1.2.1 (v1.2.2):
        // 31. AdMob banner now uses a GLOBAL mount + 90dp bottom margin.
        //     Fixes the "banner covers bottom navigation" issue on real
        //     devices. Banner auto-hides on Dashboard, Login, Admin.
        // 32. PayPartnerStore — defensive `user` prop guard shows a
        //     loading spinner instead of a blank page when the auth
        //     state hasn't hydrated yet (fixes the APK blank-screen).
        //
        // versionCode 22 → 23 — Feb 20, 2026 release (v1.2.3):
        // 33. R8 FULL MODE enabled via `android.enableR8.fullMode=true`
        //     in gradle.properties — addresses Play Console
        //     "Improve your app's memory and performance with R8" advice.
        //     Full mode unlocks whole-program optimization, aggressive
        //     method inlining, class merging, and dead-code elimination
        //     on top of the shrinking/obfuscation that were already on.
        //     Expected AAB size drop 20-30% and cold-start memory drop
        //     ~15%. JVM heap bumped 1536m → 4096m so R8 has enough
        //     headroom during bundleRelease. nonTransitiveRClass=true
        //     also enabled for faster incremental compiles.
        // 34. FIFO Monthly Reward Ceiling — user's Community Bonus
        //     capped per-role per calendar month (User ₹1L / District
        //     ₹3L / Regional ₹4L / State ₹5L / National ₹10L). Silent-
        //     skip on cap-hit, no roll-up. Admin config endpoints under
        //     /api/admin/community-caps/*.
        // 35. Same-or-higher partner_position structure validation —
        //     promoted downlines still count toward parent's structure
        //     requirement.
        // 36. Admin Popup Placement Dropdown — 7 surfaces selectable
        //     (app_startup, dashboard_home, main_mining_collect,
        //     mall_collect, partner_store_payment, community_feed,
        //     notifications).
        // 37. Redis-to-Mongo cache resilience — 500ms per-op timeout +
        //     circuit breaker (5 fails/30s → skip 60s). Silent Mongo
        //     fallback means Upstash flakiness never causes user-facing
        //     504s again. Live-verified caught 13 timeouts on first day
        //     of production without any user impact.
        // versionCode 22 → 23 — Feb 20, 2026 release (v1.2.3):
        // ... (see history above)
        //
        // versionCode 23 → 24 — Feb 20, 2026 patch (v1.2.4):
        // 38. Rewarded Interstitial bug fix — "View Live Community
        //     Activity" button now correctly shows the +5 PRC opt-in
        //     modal. Root cause: React StrictMode was killing a
        //     setTimeout in the effect cleanup so the modal never
        //     rendered. Fix: synchronous fire + useRef guard +
        //     sessionStorage handoff between source/destination pages.
        // 39. MREC (Medium Rectangle 300×250) native-style banner ad
        //     added on Community Live Feed + Notifications inbox.
        //     Separate ad unit ID from standard banner for cleaner
        //     AdMob reporting. Standard adaptive banner continues on
        //     all other pages.
        // 40. Rewarded Interstitial ad now fires on 3 more high-value
        //     flows (Feb 20 late — same v1.2.4 payload):
        //     • After successful KYC document submission → +10 PRC
        //     • After successful Bank redeem submission → +25 PRC (up from +5)
        //     • On the Pay to Partner Store success screen → +15 PRC
        //     All three use the new `onClose` callback on the rewarded
        //     hook so navigation is deferred until the modal is
        //     dismissed — prevents the source-unmount race that broke
        //     the Live Feed modal earlier.
        // versionCode 24 → 25 — Feb 20, 2026 defensive patch (v1.2.5):
        // 41. Explicit production-only AdMob enforcement — native side
        //     now calls MobileAds.setRequestConfiguration() with an
        //     empty testDeviceIds list at initialize time. This
        //     OVERRIDES any device-level auto-test flag Google's SDK
        //     may have set from a previous debug/sideload of this app,
        //     forcing real ads even on developer devices. Also added
        //     "PRODUCTION-ONLY" doc-comments in useAdMob.js and
        //     GlobalBannerAd.js confirming zero test-device
        //     configuration anywhere in the codebase.
        // versionCode 25 → 26 — Feb 20, 2026 (late) — v1.2.6 perf patch:
        // 42. Fixed a login-slowness regression caused by intermittent
        //     Upstash Redis flakiness. Cold-launch could take 20-24s
        //     because /api/app/version-info hit Mongo directly on every
        //     poll AND cache.get() didn't consult the in-process memory
        //     mirror when Redis read timed out.
        // 43. Login flow hardened against slow Mongo:
        //     • fraud_detector.check_ip_login_limit() now uses a 30s
        //       per-IP in-process cache + 3s bounded count_documents,
        //       fail-open on timeout. Previously an unindexed count
        //       on `login_attempts` stalled every login for 15+ sec.
        //     • Two-level cache — cache.set() always mirrors to
        //       memory, cache.get() checks mirror on Redis fail/timeout.
        //     • /api/app/version-info: 60s in-process cache + 1.5s
        //       bounded Mongo lookup timeout. Login flow can no
        //       longer stall on Upstash or Mongo pressure.
        // versionCode 33 → 34 — Feb 22, 2026 (v1.3.4) — ROOT CAUSE FIX:
        //     Users Collection Size-Guard
        // 53. Emergent Support diagnosed the real production latency root
        //     cause: `users` documents average ~67 KB with `mining_history`
        //     embedded as an inline array (max 6.6 MB on power users, ~1M
        //     entries across 6k users) plus base64 `profile_picture` on
        //     845 users up to 636 KB each. Every uncached find_one was
        //     pulling multi-MB documents over the shared-Atlas network →
        //     9-20s tail latency.
        //     Fix (Support's Phase 0 — the surgical no-migration win):
        //     Installed a `_UsersCollectionSizeGuard` proxy on `db.users`
        //     at startup that transparently adds `{mining_history: 0,
        //     profile_picture: 0}` to every find_one / find call unless
        //     the caller uses include-mode (leaderboard / notifications
        //     that explicitly ask for profile_picture still receive it).
        //     Aggregate / update / insert / count paths pass through
        //     unchanged.
        //     Preview proof with a synthetic 1 MB bloated user:
        //       Raw:     1,119,103 bytes (1.09 MB) in 5.4 ms
        //       Guarded: 148 bytes                 in 1.0 ms
        //     → 7 562× smaller payload, zero code touching of the 273
        //       existing users.find_one call sites.
        //     Expected prod impact: since Atlas latency scales with
        //     transfer volume, a 1 MB → 148 B reduction should collapse
        //     the 9-20 s tail to sub-100 ms.
        //     Follow-ups (Support's Phase 1 & 2): migrate mining_history
        //     to its own collection, move profile_picture to object
        //     storage. Both deferred until Phase 0 impact is measured on
        //     production.
        // versionCode 34 → 35 — Feb 25, 2026 (v1.3.5) — Play Console
        //     "1 action recommended" hardening pass.
        // 54. proguard-rules.pro expanded from 74 → ~180 lines. All the
        //     items Play Console flagged on the old v1.3.0 release were
        //     already fixed in v1.2.3 (minifyEnabled, shrinkResources,
        //     R8 full mode, obfuscation). This pass strengthens the
        //     "keep" ruleset so obfuscation is safe across every SDK
        //     the app actually pulls:
        //     - Firebase (@capacitor-firebase/app + push/analytics/etc)
        //     - Google Play Services base infra (Tasks / Auth / Common)
        //     - Google AdMob Mobile Ads SDK (24.7.0) — already covered,
        //       but re-checked for internal.ads reflection paths.
        //     - Google Play Install Referrer 2.2 (reflection-only API)
        //     - Google Play In-App Review
        //     - AndroidX Biometric (@aparajita/capacitor-biometric-auth)
        //     - Kotlin coroutines (kotlinx.coroutines.internal reflection)
        //     - Gson @SerializedName annotation preservation
        //     - Retrofit Call/Response allowobfuscation shims
        //     - javax.annotation dontwarn (generated code)
        //     - Serializable / Parcelable safety
        //     - Every @capawesome / @aparajita / ee.forgr Capacitor plugin
        //     Together these prevent the classic release-only NoClassDef /
        //     NoSuchMethod crashes without loosening R8's optimization.
        //     Play Console recommendation should fully clear on this AAB.
        // versionCode 44 → 45 — Feb 26, 2026 — v1.4.5 (Razorpay UPI in APK)
        //     - Attempted fix via method:{upi,...}:true + appendUserAgent.
        //     - Did NOT work: UPI section still hidden in APK for Service
        //       Charge checkout while Subscription checkout worked.
        // versionCode 45 → 46 — Feb 27, 2026 — v1.4.6 (Razorpay UPI in APK v2)
        //     - ROOT CAUSE: Razorpay Checkout requires an explicit
        //       `webview_intent: true` flag to expose UPI Apps (PhonePe,
        //       GPay, Paytm, BHIM, CRED) inside a Capacitor WebView. The
        //       working Subscription flow already had this flag; the
        //       Service Charge flows (MyServiceCharges.js single + bulk
        //       and ServiceChargePendingBanner.jsx) did not.
        //     - Fix: mirror Subscription — pass `webview_intent: true`
        //       when isNativePlatform() is true, and drop the ineffective
        //       method:{...} filter that was actually hiding UPI further.
        versionCode 46
        versionName "1.4.6"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // Bundle native debug symbols (SYMBOL_TABLE) into the AAB so Play
        // Console can symbolicate native crashes (AdMob, Capacitor plugins).
        // This eliminates the "missing debug symbols" warning during upload.
        // 'SYMBOL_TABLE' = only function names (small size hit ~2-3 MB)
        // 'FULL'         = function names + line numbers (larger AAB)
        ndk {
            debugSymbolLevel 'SYMBOL_TABLE'
        }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // ─────────────────────────────────────────────────────────────────────
    // RELEASE SIGNING — keystore is loaded from environment variables so the
    // .keystore file and passwords never enter the repo.
    //
    // Set these in your shell / CI before `./gradlew bundleRelease`:
    //   PARAS_KEYSTORE_FILE      = absolute path to .jks/.keystore file
    //   PARAS_KEYSTORE_PASSWORD  = keystore password
    //   PARAS_KEY_ALIAS          = key alias (e.g. paras-release)
    //   PARAS_KEY_PASSWORD       = key password
    //
    // If env vars are not set, the release config is skipped silently and
    // the build will fall back to debug signing — useful for CI smoke checks.
    // ─────────────────────────────────────────────────────────────────────
    def envKeystoreFile     = System.getenv("PARAS_KEYSTORE_FILE")
    def envKeystorePassword = System.getenv("PARAS_KEYSTORE_PASSWORD")
    def envKeyAlias         = System.getenv("PARAS_KEY_ALIAS")
    def envKeyPassword      = System.getenv("PARAS_KEY_PASSWORD")
    def hasReleaseSigning = envKeystoreFile && envKeystorePassword && envKeyAlias && envKeyPassword

    if (hasReleaseSigning) {
        signingConfigs {
            release {
                storeFile     file(envKeystoreFile)
                storePassword envKeystorePassword
                keyAlias      envKeyAlias
                keyPassword   envKeyPassword
                // Enables Play App Signing v2/v3/v4 — required for SDK 30+
                enableV2Signing true
                enableV3Signing true
            }
        }
    }
    buildTypes {
        release {
            // Code shrinking + resource shrinking — drops AAB size ~30-40%
            // and obfuscates Java/Kotlin symbols. WebView + Capacitor keep
            // rules are in proguard-rules.pro.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            // No shrinking in debug — fast iteration
            minifyEnabled false
        }
    }
    // SDK 35 (Android 15) — using Java 21 to match Capacitor's toolchain
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // Required by custom AppOpenAdPlugin for ProcessLifecycleOwner (auto-show
    // App Open ad on every app foreground/resume). Not transitive — must be
    // declared explicitly.
    implementation "androidx.lifecycle:lifecycle-process:$androidxLifecycleVersion"
    // Required by custom AppOpenAdPlugin to use com.google.android.gms.ads.appopen.AppOpenAd.
    // @capacitor-community/admob declares play-services-ads as `implementation` (not `api`),
    // so the Google Mobile Ads SDK classes are NOT visible to the :app module unless we
    // declare the dependency here too. Same major.minor as the community plugin (24.7+).
    implementation "com.google.android.gms:play-services-ads:24.7.0"
    // Required by custom InstallReferrerPlugin to capture referral attribution
    // from Play Store install link (?referrer=ref%3DABC123). Latest 2.x as of
    // Feb 2026; backward compatible with API 23+ (our minSdk).
    implementation "com.android.installreferrer:installreferrer:2.2"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

apply plugin: 'com.android.application'

android {
    namespace "com.parasreward.prc"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.parasreward.prc"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // versionCode 13 → 14 — Feb 28, 2026 release (2nd batch):
        // 1. Native App Open Ad Capacitor plugin (AppOpenAdPlugin.java)
        //    Auto-shows on every foreground/resume + cold-start branded splash
        // 2. Native Install Referrer Capacitor plugin (InstallReferrerPlugin.java)
        //    Captures Play Store referrer for native-side referral attribution
        // 3. Android App Links — autoVerify intent filter for parasreward.com
        //    + bugzappers.emergent.host (assetlinks.json served from /public/)
        // 4. Mall pricing: MRP + 18% GST + 10% Processing fee (cascading)
        // 5. Referral attribution bug fix (case-insensitive backend lookup,
        //    localStorage persistence)
        //
        // versionCode 14 → 15 — Jun 30, 2026 release:
        // 1. AndroidManifest.xml — fixed invalid `--` inside XML comment that
        //    was breaking processReleaseMainManifest in GitHub Actions.
        // 2. Confirm Booking sheet visibility fix (white-on-white pricing rows).
        // 3. Admin Mall: "Mining Complete" bookings now load via per-status
        //    fetch (fulfilled+delivered+recent-mining) so older fulfilled
        //    rows are never buried by mining churn.
        // 4. Community Forum: new "🚚 Product Delivery" head — admin
        //    "Mark Delivered" auto-publishes celebratory post (real name +
        //    product image) for social proof.
        // 5. Production performance pass: 60s cache layer on
        //    performance-summary / redeem-limit / mining-status / kyc-stats /
        //    gst-summary / public-contact-info; admin redeem-limits-overview
        //    moved to lazy-load. Dashboard time-to-data 10s → 1-2s.
        //
        // versionCode 15 → 16 — Jul 03, 2026 release:
        // 1. Razorpay UPI Apps (PhonePe / GPay / Paytm / BHIM / Amazon Pay /
        //    WhatsApp Pay etc.) missing from checkout in Android APP fix.
        //    Root cause: Android 11+ (API 30+) package visibility restriction
        //    meant PackageManager.queryIntentActivities() returned EMPTY for
        //    UPI apps → Razorpay Checkout.js hid the UPI Apps section.
        //    Fix (AndroidManifest.xml): Added <queries> block declaring the
        //    upi:// intent + explicit UPI PSP package names so the checkout
        //    can enumerate installed UPI apps.
        //    Fix (MainActivity.java): Override WebViewClient to correctly
        //    parse intent:// scheme URIs via Intent.parseUri(URI_INTENT_SCHEME)
        //    — Capacitor's default handler used plain Intent(ACTION_VIEW, uri)
        //    which fails to route to the intent's target package.
        // 2. Admin User 360 PIN Reset modal persistence fix (state race that
        //    made the newly generated PIN vanish before admin could copy).
        versionCode 16
        versionName "1.1.5"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // Bundle native debug symbols (SYMBOL_TABLE) into the AAB so Play
        // Console can symbolicate native crashes (AdMob, Capacitor plugins).
        // This eliminates the "missing debug symbols" warning during upload.
        // 'SYMBOL_TABLE' = only function names (small size hit ~2-3 MB)
        // 'FULL'         = function names + line numbers (larger AAB)
        ndk {
            debugSymbolLevel 'SYMBOL_TABLE'
        }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // ─────────────────────────────────────────────────────────────────────
    // RELEASE SIGNING — keystore is loaded from environment variables so the
    // .keystore file and passwords never enter the repo.
    //
    // Set these in your shell / CI before `./gradlew bundleRelease`:
    //   PARAS_KEYSTORE_FILE      = absolute path to .jks/.keystore file
    //   PARAS_KEYSTORE_PASSWORD  = keystore password
    //   PARAS_KEY_ALIAS          = key alias (e.g. paras-release)
    //   PARAS_KEY_PASSWORD       = key password
    //
    // If env vars are not set, the release config is skipped silently and
    // the build will fall back to debug signing — useful for CI smoke checks.
    // ─────────────────────────────────────────────────────────────────────
    def envKeystoreFile     = System.getenv("PARAS_KEYSTORE_FILE")
    def envKeystorePassword = System.getenv("PARAS_KEYSTORE_PASSWORD")
    def envKeyAlias         = System.getenv("PARAS_KEY_ALIAS")
    def envKeyPassword      = System.getenv("PARAS_KEY_PASSWORD")
    def hasReleaseSigning = envKeystoreFile && envKeystorePassword && envKeyAlias && envKeyPassword

    if (hasReleaseSigning) {
        signingConfigs {
            release {
                storeFile     file(envKeystoreFile)
                storePassword envKeystorePassword
                keyAlias      envKeyAlias
                keyPassword   envKeyPassword
                // Enables Play App Signing v2/v3/v4 — required for SDK 30+
                enableV2Signing true
                enableV3Signing true
            }
        }
    }
    buildTypes {
        release {
            // Code shrinking + resource shrinking — drops AAB size ~30-40%
            // and obfuscates Java/Kotlin symbols. WebView + Capacitor keep
            // rules are in proguard-rules.pro.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            // No shrinking in debug — fast iteration
            minifyEnabled false
        }
    }
    // SDK 35 (Android 15) — using Java 21 to match Capacitor's toolchain
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // Required by custom AppOpenAdPlugin for ProcessLifecycleOwner (auto-show
    // App Open ad on every app foreground/resume). Not transitive — must be
    // declared explicitly.
    implementation "androidx.lifecycle:lifecycle-process:$androidxLifecycleVersion"
    // Required by custom AppOpenAdPlugin to use com.google.android.gms.ads.appopen.AppOpenAd.
    // @capacitor-community/admob declares play-services-ads as `implementation` (not `api`),
    // so the Google Mobile Ads SDK classes are NOT visible to the :app module unless we
    // declare the dependency here too. Same major.minor as the community plugin (24.7+).
    implementation "com.google.android.gms:play-services-ads:24.7.0"
    // Required by custom InstallReferrerPlugin to capture referral attribution
    // from Play Store install link (?referrer=ref%3DABC123). Latest 2.x as of
    // Feb 2026; backward compatible with API 23+ (our minSdk).
    implementation "com.android.installreferrer:installreferrer:2.2"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

apply plugin: 'com.android.application'

android {
    namespace "com.parasreward.prc"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.parasreward.prc"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // versionCode 12 → 13 — Feb 23, 2026:
        // 1. Product Mining: 60s cooldown + manual Start Session
        // 2. Native debug symbols (SYMBOL_TABLE) bundled in AAB
        // 3. Service worker network-first HTML + auto-reload on update
        // 4. Rewarded-ad opt-in on every Collect (Main + Mall): +5..10 bonus PRC
        // 5. AdMob Mediation adapters added (Meta, Unity, AppLovin, Mintegral)
        //    → +30..50% revenue once activated in AdMob Console
        versionCode 13
        versionName "1.1.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // Bundle native debug symbols (SYMBOL_TABLE) into the AAB so Play
        // Console can symbolicate native crashes (AdMob, Capacitor plugins).
        // This eliminates the "missing debug symbols" warning during upload.
        // 'SYMBOL_TABLE' = only function names (small size hit ~2-3 MB)
        // 'FULL'         = function names + line numbers (larger AAB)
        ndk {
            debugSymbolLevel 'SYMBOL_TABLE'
        }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // ─────────────────────────────────────────────────────────────────────
    // RELEASE SIGNING — keystore is loaded from environment variables so the
    // .keystore file and passwords never enter the repo.
    //
    // Set these in your shell / CI before `./gradlew bundleRelease`:
    //   PARAS_KEYSTORE_FILE      = absolute path to .jks/.keystore file
    //   PARAS_KEYSTORE_PASSWORD  = keystore password
    //   PARAS_KEY_ALIAS          = key alias (e.g. paras-release)
    //   PARAS_KEY_PASSWORD       = key password
    //
    // If env vars are not set, the release config is skipped silently and
    // the build will fall back to debug signing — useful for CI smoke checks.
    // ─────────────────────────────────────────────────────────────────────
    def envKeystoreFile     = System.getenv("PARAS_KEYSTORE_FILE")
    def envKeystorePassword = System.getenv("PARAS_KEYSTORE_PASSWORD")
    def envKeyAlias         = System.getenv("PARAS_KEY_ALIAS")
    def envKeyPassword      = System.getenv("PARAS_KEY_PASSWORD")
    def hasReleaseSigning = envKeystoreFile && envKeystorePassword && envKeyAlias && envKeyPassword

    if (hasReleaseSigning) {
        signingConfigs {
            release {
                storeFile     file(envKeystoreFile)
                storePassword envKeystorePassword
                keyAlias      envKeyAlias
                keyPassword   envKeyPassword
                // Enables Play App Signing v2/v3/v4 — required for SDK 30+
                enableV2Signing true
                enableV3Signing true
            }
        }
    }
    buildTypes {
        release {
            // Code shrinking + resource shrinking — drops AAB size ~30-40%
            // and obfuscates Java/Kotlin symbols. WebView + Capacitor keep
            // rules are in proguard-rules.pro.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            // No shrinking in debug — fast iteration
            minifyEnabled false
        }
    }
    // SDK 35 (Android 15) — using Java 21 to match Capacitor's toolchain
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')

    // ── AdMob Mediation Adapters (Feb 2026) ──────────────────────────────
    // These pull in third-party ad-network SDKs so AdMob's mediation can
    // bid them in waterfall. Versions match Google's "Latest verified
    // adapter" list as of 2026-02. Each adapter also requires app-id /
    // placement setup in the AdMob Console → Mediation → Mediation groups.
    //
    // Revenue impact (Indian eCPM, average):
    //   - AdMob alone:                    ₹0.80–₹1.20
    //   - + Meta Audience Network:        +25–35%
    //   - + Unity Ads:                    +15–20%
    //   - + AppLovin:                     +20–30%
    //   - + Mintegral:                    +10–15%
    //
    // If a network is removed from the AdMob mediation group, leaving its
    // adapter here is harmless — it just won't get filled.

    implementation 'com.google.ads.mediation:facebook:6.18.0.0'      // Meta Audience Network
    implementation 'com.google.ads.mediation:unity:4.12.5.0'          // Unity Ads
    implementation 'com.google.ads.mediation:applovin:13.0.1.0'       // AppLovin
    implementation 'com.google.ads.mediation:mintegral:16.8.61.0'     // Mintegral
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

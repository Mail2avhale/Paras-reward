# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
#
# Feb 20 2026 — bumped from 1536m → 4096m so R8 full mode (see
# android.enableR8.fullMode below) has enough heap to run whole-program
# optimization on the release AAB. R8 full mode uses ~2-3× more heap
# than compatibility mode; 4 GB is the widely recommended headroom.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/build_environment.html#sec:decoupled_projects
# org.gradle.parallel=true

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# ────────────────────────────────────────────────────────────────────────
# R8 FULL MODE (Feb 20 2026)
# Addresses Google Play Console "Improve your app's memory and performance
# with R8 optimization" recommendation. Enables whole-program optimization,
# aggressive inlining, class merging, and dead-code elimination. Together
# with `minifyEnabled true` + `shrinkResources true` (in app/build.gradle)
# this delivers the full R8 pipeline instead of compatibility mode.
# ────────────────────────────────────────────────────────────────────────
android.enableR8.fullMode=true

# Enable non-transitive R class references — smaller R class = faster
# incremental compile and slightly smaller AAB. Safe default for
# Capacitor projects (we don't do runtime R.class reflection).
android.nonTransitiveRClass=true

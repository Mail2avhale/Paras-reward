    <!--
      Stale-cache self-heal (Feb 2026)
      ────────────────────────────────────────────────────────────────
      Why: After each deploy, users on an older service-worker version
      were stuck on "Loading…" until they manually cleared browsing data,
      because their cached index.html / JS chunks referenced hashed files
      that no longer exist on the server. The newer SW (v94+) avoids this
      via network-first HTML, but users still on v93 or older need a
      JS-level escape hatch — that is what this script provides.

      Behaviour:
        1. Sets a 12-second watchdog. If React hasn't replaced the
           `.initial-loader` by then OR any chunk script errors out,
           assume the cache is poisoned.
        2. On detection, unregister every Service Worker, delete every
           cache, and hard-reload with a cache-buster query string.
        3. The reload is throttled to once per 60 seconds via
           sessionStorage so the user never falls into an infinite loop.
        4. After ONE successful self-heal the new SW (v97+) is in
           charge, this script becomes a no-op for that user forever.
    -->
    <script>
      (function () {
        var SELF_HEAL_KEY = "paras_self_heal_ts";
        var WATCHDOG_MS = 5000; // was 12000 — be aggressive on slow networks
        var THROTTLE_MS = 20000; // was 60000 — allow re-heal sooner
        function selfHeal(reason, ignoreThrottle) {
          try {
            if (!ignoreThrottle) {
              var last = parseInt(sessionStorage.getItem(SELF_HEAL_KEY) || "0", 10);
              if (Date.now() - last < THROTTLE_MS) return;
            }
            sessionStorage.setItem(SELF_HEAL_KEY, String(Date.now()));
          } catch (e) { /* private mode: ignore */ }
          console.warn("[self-heal] triggered:", reason);
          var done = function () {
            // Try forcing network revalidation via fetch with cache:reload,
            // then navigate. If the fetch throws, fall back to a simple
            // navigation. The query string flips on every heal so even an
            // aggressive intermediary cache picks up a new URL.
            var u = new URL(window.location.href);
            u.searchParams.set("_h", Date.now().toString(36));
            try {
              fetch(u.toString(), { cache: "reload", credentials: "same-origin" })
                .catch(function () {})
                .finally(function () { window.location.replace(u.toString()); });
            } catch (e) {
              window.location.replace(u.toString());
            }
          };
          try {
            var swPromise = ("serviceWorker" in navigator)
              ? navigator.serviceWorker.getRegistrations().then(function (rs) {
                  return Promise.all(rs.map(function (r) { return r.unregister(); }));
                }).catch(function () {})
              : Promise.resolve();
            var cachePromise = (window.caches)
              ? caches.keys().then(function (ks) {
                  return Promise.all(ks.map(function (k) { return caches.delete(k); }));
                }).catch(function () {})
              : Promise.resolve();
            Promise.all([swPromise, cachePromise]).then(done, done);
          } catch (e) { done(); }
        }
        window.addEventListener("error", function (ev) {
          var t = ev && ev.target;
          if (t && (t.tagName === "SCRIPT" || t.tagName === "LINK")) {
            var src = t.src || t.href || "";
            if (src && src.indexOf("/static/") !== -1) {
              selfHeal("chunk-load-fail: " + src, true);
            }
          }
        }, true);
        // Watchdog — short fuse so users never sit on a stuck spinner.
        setTimeout(function () {
          var loaderStill = document.querySelector(".initial-loader") !== null;
          var rootEmpty = document.getElementById("root").childElementCount <= 1;
          if (loaderStill || rootEmpty) selfHeal("watchdog-5s loader=" + loaderStill + " emptyRoot=" + rootEmpty);
        }, WATCHDOG_MS);
        // Secondary watchdog — if user is still on a "Loading" page after
        // 15s (slow network, but new assets fully fetched should have
        // booted React by now), force-heal ignoring throttle.
        setTimeout(function () {
          if (document.querySelector(".initial-loader") !== null) {
            selfHeal("watchdog-15s-stuck", true);
          }
        }, 15000);
        // Tertiary watchdog (Jun 2026) — catches the stuck React Suspense
        // case where the inline loader is gone (React booted) but a lazy
        // chunk fetch hangs because Emergent's static host returned
        // index.html for a missing /static/js/*.js path. Look for the
        // Suspense "Loading..." paragraph used in App.js LoadingFallback.
        setTimeout(function () {
          try {
            var root = document.getElementById("root");
            if (!root) return;
            var txt = (root.innerText || "").trim();
            // If after 20s we ONLY see "Loading…" in #root, it's stuck.
            if (txt === "Loading..." || txt === "Loading…" || /^Loading\.{2,3}$/.test(txt)) {
              selfHeal("watchdog-20s-suspense-stuck", true);
            }
          } catch (e) { /* ignore */ }
        }, 20000);
      })();
    </script>

    <div id="root">
      <!-- Initial loader shown while React loads -->
      <div class="initial-loader">
        <div class="loader-spinner"></div>
      </div>
    </div>
